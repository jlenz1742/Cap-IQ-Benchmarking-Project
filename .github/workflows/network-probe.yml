name: network-probe
on:
  push:
    branches:
      - claude/milwaukee-dealers-scraper-ulrem0
    paths:
      - '.github/workflows/network-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Probe milwaukeetool.com
        run: |
          cat > probe.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              viewport: { width: 1366, height: 900 },
            });
            const page = await context.newPage();
            const xhrLog = [];
            page.on('request', (req) => {
              if (['xhr', 'fetch'].includes(req.resourceType())) {
                xhrLog.push({ phase: 'request', method: req.method(), url: req.url(), postData: req.postData() });
              }
            });
            page.on('response', async (res) => {
              const req = res.request();
              if (['xhr', 'fetch'].includes(req.resourceType())) {
                let body = null;
                try { body = await res.text(); } catch (e) { body = 'ERR:' + e.message; }
                xhrLog.push({ phase: 'response', status: res.status(), url: req.url(), body: body ? body.slice(0, 5000) : null });
              }
            });

            await page.goto('https://www.milwaukeetool.com/buy-now', { waitUntil: 'networkidle', timeout: 45000 });
            const html = await page.content();
            fs.writeFileSync('page.html', html);

            // dump script srcs
            const scriptSrcs = await page.$$eval('script[src]', els => els.map(e => e.src));
            fs.writeFileSync('script-srcs.json', JSON.stringify(scriptSrcs, null, 2));

            // look for likely search inputs
            const inputInfo = await page.$$eval('input', els => els.map(e => ({
              id: e.id, name: e.name, placeholder: e.placeholder, type: e.type, className: e.className
            })));
            fs.writeFileSync('inputs.json', JSON.stringify(inputInfo, null, 2));

            // look for elements with dealer/locator/store related ids/classes
            const candidates = await page.evaluate(() => {
              const all = Array.from(document.querySelectorAll('[id],[class]'));
              const kw = /locator|dealer|distributor|store|zip|find/i;
              return all
                .filter(e => kw.test(e.id) || kw.test(e.className))
                .slice(0, 100)
                .map(e => ({ tag: e.tagName, id: e.id, className: typeof e.className === 'string' ? e.className : '' }));
            });
            fs.writeFileSync('candidates.json', JSON.stringify(candidates, null, 2));

            // try typing a zip into any likely input and submit, to trigger the real API call
            try {
              const zipInput = await page.$('input[placeholder*="zip" i], input[placeholder*="Zip" i], input[id*="zip" i], input[name*="zip" i], input[placeholder*="location" i], input[placeholder*="city" i]');
              if (zipInput) {
                await zipInput.click();
                await zipInput.fill('53201');
                await page.keyboard.press('Enter');
                await page.waitForTimeout(5000);
              } else {
                fs.writeFileSync('note.txt', 'no zip-like input found via simple selector');
              }
            } catch (e) {
              fs.writeFileSync('search-error.txt', e.message);
            }

            fs.writeFileSync('xhr-log.json', JSON.stringify(xhrLog, null, 2));
            const html2 = await page.content();
            fs.writeFileSync('page-after-search.html', html2);

            await browser.close();
          })();
          EOF
          node probe.js
      - uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: |
            page.html
            page-after-search.html
            script-srcs.json
            inputs.json
            candidates.json
            xhr-log.json
            note.txt
            search-error.txt
          if-no-files-found: ignore
