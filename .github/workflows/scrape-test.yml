name: scrape-test
on:
  push:
    branches:
      - claude/milwaukee-dealers-scraper-ulrem0
    paths:
      - '.github/workflows/scrape-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright npm package
        timeout-minutes: 3
        run: npm install playwright@1.56.1
      - name: Run scraper on test zip list
        timeout-minutes: 5
        run: |
          ZIP_FILE=data/test_zips.csv OUT_FILE=results.jsonl ERR_FILE=errors.jsonl node scripts/scrape-dealers.js
      - name: Merge results
        run: node scripts/merge-results.js dealers-test.csv results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: scrape-test-output
          path: |
            results.jsonl
            errors.jsonl
            dealers-test.csv
          if-no-files-found: warn
