name: scrape-test
on:
  push:
    branches:
      - claude/milwaukee-dealers-scraper-ulrem0
    paths:
      - '.github/workflows/scrape-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run scraper on test zip list
        run: |
          ZIP_FILE=data/test_zips.csv OUT_FILE=results.jsonl ERR_FILE=errors.jsonl node scripts/scrape-dealers.js
      - name: Merge results
        run: node scripts/merge-results.js dealers-test.csv results.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: scrape-test-output
          path: |
            results.jsonl
            errors.jsonl
            dealers-test.csv
          if-no-files-found: warn
